iris.features.required = CUSTOM_IMAGES SSBO COMPUTE_SHADERS BLOCK_EMISSION_ATTRIBUTE REVERSED_CULLING

clouds = off
oldLighting = false
oldHandLight = false
dynamicHandLight = false
underwaterOverlay = false
vignette = false
sun = false
moon = false
stars = false
separateAo = true
frustum.culling = true
shadow.enabled = true
shadow.culling = reversed
voxelizeLightBlocks = true
allowConcurrentCompute = false

# G-Buffer opaque passes write packed integer material buffers (no blending).
blend.shadow = off
blend.gbuffers_terrain = off
blend.gbuffers_entities = off
blend.gbuffers_block = off
blend.gbuffers_hand = off
blend.gbuffers_textured = off
blend.gbuffers_basic = off
# Translucent forward pass writes separable layers resolved inside composite TAA:
# colortex6 = in-scattered/reflected radiance (premultiplied over-blend),
# colortex7 = per-channel transmittance (multiplicative), colortex8 = refraction offset (nearest layer).
blend.gbuffers_water = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex7 = DST_COLOR ZERO DST_ALPHA ZERO
blend.gbuffers_water.colortex8 = off
blend.gbuffers_line = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_line.colortex7 = DST_COLOR ZERO DST_ALPHA ZERO

# Bind block atlas and LabPBR specular atlas to unused colortex14/15
# (never gaux1/gaux2, which alias colortex4/colortex5 in Iris!).
texture.prepare.colortex14 = minecraft:textures/atlas/blocks.png
texture.prepare.colortex15 = minecraft:textures/atlas/blocks_s.png
texture.gbuffers.colortex14 = minecraft:textures/atlas/blocks.png
texture.gbuffers.colortex15 = minecraft:textures/atlas/blocks_s.png
texture.deferred.colortex14 = minecraft:textures/atlas/blocks.png
texture.deferred.colortex15 = minecraft:textures/atlas/blocks_s.png
texture.composite.colortex14 = minecraft:textures/atlas/blocks.png
texture.composite.colortex15 = minecraft:textures/atlas/blocks_s.png

# Christoph Peters, Free Blue Noise Textures (CC0), 128_128/LDR_RG01_0.png.
customTexture.ggxBlueNoise = textures/LDR_RG01_0.png
size.buffer.colortex14 = 1 1
size.buffer.colortex15 = 1 1

# ---- Custom 3D Images (160 x 96 x 160 direct-indexed grid + 4x4x4 and 16x16x16 skip maps) ----
# voxelGridImg: 0 = empty, 1 = occupied (2.4 MB, sparsely cleared by begin.csh)
image.voxelGridImg = voxelGridTex red_integer r8ui unsigned_byte false false 160 96 160
# brickOccImg: 4x4x4 occupancy (40 x 24 x 40 = 38 KB; persistent so begin.csh skips empty bricks!)
image.brickOccImg = brickOccTex red_integer r8ui unsigned_byte false false 40 24 40
# superOccImg: 16x16x16 occupancy (10 x 6 x 10 = 600 B, L1 resident; persistent for begin.csh early-out!)
image.superOccImg = superOccTex red_integer r8ui unsigned_byte false false 10 6 10

# ---- Denoiser history and scratch atlases ----
# Two radiance histories and four working tiles per signal; glossy tracking has two extra ping-pong tiles.
image.lightGuideImg = lightGuideTex rgba rgba32f float false true 1 1
image.diffuseWorkImg = diffuseWorkTex rgba rgba16f float false true 2 2
image.diffuseHistoryImg = diffuseHistoryTex rgba rgba16f float false true 2 1
#ifdef SPECULAR_REFLECTIONS
image.glossWorkImg = glossWorkTex rgba rgba16f float false true 2 2
image.glossHistoryImg = glossHistoryTex rgba rgba16f float false true 2 2
#endif
# Previous-frame face normal + reflection class, shading normal, roughness, and linear view depth.
image.prevGuideImg = prevGuideTex rgba rgba32f float false true 1 1
# Bloom pyramid scratch atlas
image.scratchImg = scratchTex rgba rgba16f float false true 2 1
# TAA history buffer (ping-pong 2x1 tiles: eliminates composite1.csh copy pass!)
image.taaHistImg = taaHistTex rgba rgba16f float false true 2 1
# Persistent 1x1 temporal auto-exposure state (r: adapted log2 luma, g: exposure multiplier)
# Texel (1,0) stores the next history frame number and viewport dimensions.
image.exposureImg = exposureTex rgba rgba32f float false false 2 1

# ---- Physical Atmosphere LUTs (Hillaire 2020: Transmittance, Multi-Scattering, Sky-View) ----
image.atmoTransImg = atmoTransTex rgba rgba16f float false false 256 64
image.atmoMultiImg = atmoMultiTex rgba rgba16f float false false 32 32
image.atmoSkyImg = atmoSkyTex rgba rgba16f float false false 192 108

# ---- SSBOs ----
# binding 0: Direct-addressed Track 1 SurfaceVoxel pool (160*96*160 * 32B = 78,643,200 B, zero spinlocks!)
bufferObject.0 = 78643200
# binding 1: Track 2 Non-Cube Primitives (16B header + 1048576 * 48B = 50,331,664 B)
bufferObject.1 = 50331664
# binding 2: World-Space 4-Way Set-Associative Surface Hash Cache (262,144 * 16B = 4,194,304 B, 64B cache-line buckets!)
bufferObject.2 = 4194304
# binding 3: Per-frame Emissive Voxel LightList + 5x3x5 Local 32^3 Macro-Cell Grid (208,192 B, L2-resident!)
bufferObject.3 = 208192

# ---- Custom Uniforms ----
variable.float.camVel_x = floor(cameraPositionInt.x - previousCameraPositionInt.x) + (cameraPositionFract.x - previousCameraPositionFract.x)
variable.float.camVel_y = floor(cameraPositionInt.y - previousCameraPositionInt.y) + (cameraPositionFract.y - previousCameraPositionFract.y)
variable.float.camVel_z = floor(cameraPositionInt.z - previousCameraPositionInt.z) + (cameraPositionFract.z - previousCameraPositionFract.z)
uniform.vec3.cameraVelocity = vec3(camVel_x, camVel_y, camVel_z)

# Continuous R2 subpixel TAA jitter (exact +-0.5 px in NDC, 32 distinct subpixels)
variable.float.taaR2_x = frac(frameCounter / 1.3247179572 + 0.5) * 2.0 - 1.0
variable.float.taaR2_y = frac(frameCounter / 1.7548776662 + 0.5) * 2.0 - 1.0
uniform.vec2.taaJitter = vec2(taaR2_x / viewWidth, taaR2_y / viewHeight)

program.prepare4.enabled = SPECULAR_REFLECTIONS

# ---- Options Menu ----
screen = [PATH_TRACING] [ATMOSPHERE] [WATER] [POST_PROCESSING] [DEBUG]
screen.PATH_TRACING = DIFFUSE_TRACE_RES SPECULAR_CHECKERBOARD DIFFUSE_SSRT SPECULAR_SSR PATH_GUIDING SPECULAR_REFLECTIONS shadowMapResolution shadowDistance TAA_ENABLED
screen.ATMOSPHERE = AERIAL_PERSPECTIVE FOG_DENSITY STAR_INTENSITY
screen.WATER = WATER_PARALLAX WATER_CAUSTICS WAVE_STRENGTH
screen.POST_PROCESSING = TONEMAP_MODE AUTO_EXPOSURE EXPOSURE BLOOM_ENABLED BLOOM_STRENGTH
screen.DEBUG = DEBUG_VIEW

# Raw diffuse GI displays the trace before either RELAX signal is resolved.
#if DEBUG_VIEW == 1
    program.deferred3.enabled = false
    program.deferred4.enabled = false
    program.deferred5.enabled = false
    program.deferred6.enabled = false
    program.deferred7.enabled = false
    program.deferred8.enabled = false
    program.deferred9.enabled = false
    program.deferred10.enabled = false
    program.deferred11.enabled = false
    program.deferred12.enabled = false
#endif

# Skip Bloom & Auto-Exposure pyramid passes when both features are turned off.
#if !defined(BLOOM_ENABLED) && !defined(AUTO_EXPOSURE)
    program.composite1.enabled = false
    program.composite2.enabled = false
    program.composite3.enabled = false
    program.composite4.enabled = false
    program.composite5.enabled = false
#endif
#ifndef BLOOM_ENABLED
    program.composite6.enabled = false
    program.composite7.enabled = false
    program.composite8.enabled = false
    program.composite9.enabled = false
#endif
